name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          {
            POSTGRES_USER: postgres,
            POSTGRES_PASSWORD: ci-test-only,
            POSTGRES_DB: langkahku_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/langkahku
      TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/langkahku_test
      SESSION_SECRET: ci-test-only-secret-at-least-32-characters
      PG_BIN: /usr/bin
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: backend/package-lock.json,
          }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: node -e "require('node:fs').writeFileSync('.env','')"
      - run: npm run lint -- --max-warnings=0
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/langkahku_test
      - run: npm test
      - run: npm audit --audit-level=high
